name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch three.js r128 for the scenery clearance test
        run: |
          mkdir -p tests/vendor && cd tests/vendor
          npm pack three@0.128.0 --silent
          tar -xzf three-0.128.0.tgz package/build/three.min.js && mv package/build/three.min.js . && rm -rf package three-0.128.0.tgz
      - name: Physics tests
        run: node --test tests/*.test.js
      - name: Build
        run: ./build.sh
      - name: Committed index.html matches the build
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error file=index.html::index.html is out of date. Run ./build.sh and commit the result."
            git diff --stat -- index.html
            exit 1
          fi
